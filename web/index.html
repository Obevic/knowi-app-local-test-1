<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chronometer</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="panel">
    <p class="panel__eyebrow">Local Standard Time</p>

    <main>
      <div class="dial-wrap">
        <svg class="dial" viewBox="0 0 300 300" role="img" aria-label="Analog clock face showing the current time">
          <circle class="dial__face" cx="150" cy="150" r="140"></circle>
          <circle class="dial__rim" cx="150" cy="150" r="134"></circle>
          <g id="ticks"></g>
          <text class="dial__numeral" x="150" y="42" text-anchor="middle">XII</text>
          <text class="dial__numeral" x="258" y="157" text-anchor="middle">III</text>
          <text class="dial__numeral" x="150" y="270" text-anchor="middle">VI</text>
          <text class="dial__numeral" x="42" y="157" text-anchor="middle">IX</text>
          <line id="hourHand" class="dial__hand dial__hand--hour" x1="150" y1="150" x2="150" y2="92"></line>
          <line id="minuteHand" class="dial__hand dial__hand--minute" x1="150" y1="150" x2="150" y2="66"></line>
          <line id="secondHand" class="dial__hand dial__hand--second" x1="150" y1="150" x2="150" y2="54"></line>
          <circle class="dial__pivot" cx="150" cy="150" r="5"></circle>
        </svg>
      </div>

      <div class="readout">
        <p class="readout__time" id="digitalTime" role="timer" aria-live="off">--:--:--</p>
        <p class="readout__meridiem" id="meridiem"></p>
      </div>
      <p class="readout__date" id="dateLine">Reading the dial…</p>

      <div class="controls">
        <button type="button" id="formatToggle" class="format-toggle" role="switch" aria-checked="false">
          <span>24-hour format</span>
          <span class="format-toggle__track" aria-hidden="true">
            <span class="format-toggle__thumb"></span>
          </span>
        </button>
      </div>
    </main>

    <footer class="panel__footer">
      <span id="tzName">—</span>
      <span class="dot" aria-hidden="true">•</span>
      <span id="utcOffset">—</span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
