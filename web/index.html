<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supporter Hub</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary">
      <div class="sidebar-top">
        <div class="logo">
          <svg class="logo-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false">
            <path d="M16 3 L28 9 V17 C28 24 22 28.5 16 30 C10 28.5 4 24 4 17 V9 Z" fill="none" stroke="#375357" stroke-width="2" stroke-linejoin="round"></path>
            <path d="M16 11 C14.5 11 13.5 12 13.5 13.4 C13.5 15.5 16 17 16 17 C16 17 18.5 15.5 18.5 13.4 C18.5 12 17.5 11 16 11 Z" fill="#375357"></path>
          </svg>
          <span class="logo-text">Supporter Hub</span>
        </div>
      </div>
      <nav class="nav" aria-label="Sections">
        <a class="nav-link is-active" href="#" aria-current="page">
          <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path d="M4 5h16v3H4zM4 10.5h16v3H4zM4 16h16v3H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
          </svg>
          <span class="nav-label">Payments</span>
          <span class="nav-count" id="navCount" aria-hidden="true">–</span>
        </a>
      </nav>
      <div class="sidebar-bottom">
        <div class="viewer">
          <span class="viewer-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" focusable="false">
              <circle cx="12" cy="9" r="3.4" fill="none" stroke="#4E6E78" stroke-width="1.6"></circle>
              <path d="M5 19c0-3.3 3.1-5 7-5s7 1.7 7 5" fill="none" stroke="#4E6E78" stroke-width="1.6" stroke-linecap="round"></path>
            </svg>
          </span>
          <span class="viewer-name" id="viewerName">Fundraising team</span>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="page-head">
        <div class="head-row">
          <div class="head-titles">
            <h1 class="page-title">Supporter Hub</h1>
            <p class="page-subtitle" id="dateRange">Loading payment dates…</p>
          </div>
          <span class="pill pill-synthetic" id="syntheticPill" hidden>Synthetic preview</span>
        </div>
      </header>

      <section class="kpi-strip" aria-label="Key figures">
        <div class="kpi-card">
          <span class="kpi-label">Total raised</span>
          <span class="kpi-value" id="kpiTotal">–</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Supporters</span>
          <span class="kpi-value" id="kpiSupporters">–</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Recurring donors</span>
          <span class="kpi-value" id="kpiRecurring">–</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Average gift</span>
          <span class="kpi-value" id="kpiAvg">–</span>
        </div>
      </section>

      <section class="filters" aria-label="Filters">
        <div class="filter-group">
          <label class="filter-label" for="searchInput">Search</label>
          <input type="search" id="searchInput" class="input" placeholder="Name, email or receipt number" autocomplete="off" />
        </div>
        <div class="filter-group">
          <label class="filter-label" for="yearSelect">Financial year</label>
          <select id="yearSelect" class="input select">
            <option value="__all__">All years</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="methodSelect">Payment method</label>
          <select id="methodSelect" class="input select">
            <option value="__all__">All methods</option>
          </select>
        </div>
        <div class="filter-group filter-check">
          <label class="check-label" for="successOnly">
            <input type="checkbox" id="successOnly" class="check" checked />
            <span>Successful only</span>
          </label>
        </div>
      </section>

      <section class="table-card" aria-label="Payments">
        <div class="table-scroll" id="tableScroll">
          <table class="payments-table" id="paymentsTable">
            <thead>
              <tr>
                <th scope="col" data-key="payment_at" class="sortable" aria-sort="descending"><button type="button" class="sort-btn">Date <span class="sort-ind" aria-hidden="true"></span></button></th>
                <th scope="col" data-key="supporter_name" class="sortable"><button type="button" class="sort-btn">Supporter <span class="sort-ind" aria-hidden="true"></span></button></th>
                <th scope="col" data-key="project" class="sortable"><button type="button" class="sort-btn">Project <span class="sort-ind" aria-hidden="true"></span></button></th>
                <th scope="col" data-key="payment_method" class="sortable"><button type="button" class="sort-btn">Method <span class="sort-ind" aria-hidden="true"></span></button></th>
                <th scope="col" data-key="amount_paid" class="sortable num"><button type="button" class="sort-btn">Amount <span class="sort-ind" aria-hidden="true"></span></button></th>
                <th scope="col" data-key="fee_amount" class="sortable num"><button type="button" class="sort-btn">Fee <span class="sort-ind" aria-hidden="true"></span></button></th>
                <th scope="col" data-key="status" class="sortable"><button type="button" class="sort-btn">Status <span class="sort-ind" aria-hidden="true"></span></button></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <div class="card-list" id="cardList" hidden></div>

        <div class="table-state" id="tableState" hidden>
          <div class="state-inner" id="stateInner"></div>
        </div>

        <div class="table-foot">
          <span class="foot-info" id="footInfo">Showing 0–0 of 0</span>
          <div class="foot-pager">
            <button type="button" class="btn btn-ghost" id="prevBtn" disabled>Previous</button>
            <button type="button" class="btn btn-ghost" id="nextBtn" disabled>Next</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="panel-backdrop" id="panelBackdrop" hidden></div>
  <aside class="side-panel" id="sidePanel" role="dialog" aria-modal="true" aria-labelledby="panelName" hidden>
    <div class="panel-head">
      <h2 class="panel-title" id="panelName">Supporter</h2>
      <button type="button" class="panel-close" id="panelClose" aria-label="Close panel">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
      </button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
