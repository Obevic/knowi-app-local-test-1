<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supporter Hub</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar" aria-label="Primary">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20s-7-4.35-7-9.5A4 4 0 0 1 12 8a4 4 0 0 1 7 2.5C19 15.65 12 20 12 20Z"></path>
              <path d="M12 8V4M10 6h4"></path>
            </svg>
          </span>
          <span class="brand-name">Supporter Hub</span>
        </div>
      </div>

      <nav class="nav" aria-label="Sections">
        <a class="nav-link is-active" href="#payments" aria-current="page">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="6" width="18" height="12" rx="2"></rect>
              <path d="M3 10h18"></path>
              <path d="M7 14h4"></path>
            </svg>
          </span>
          <span class="nav-label">Payments</span>
          <span id="navCount" class="nav-count" aria-hidden="true">0</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="viewer">
          <span class="viewer-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="3.2"></circle>
              <path d="M5 19c0-3.3 3.1-5 7-5s7 1.7 7 5"></path>
            </svg>
          </span>
          <span id="viewerName" class="viewer-name">Viewer</span>
        </div>
      </div>
    </aside>

    <main class="canvas">
      <div class="content">
        <header id="header" class="page-header">
          <div class="header-row">
            <div class="header-titles">
              <h1 class="page-title">Supporter Hub</h1>
              <p id="subtitle" class="page-subtitle">Loading payment history…</p>
            </div>
            <span id="previewPill" class="pill pill-preview" hidden>Synthetic preview</span>
          </div>
        </header>

        <section class="kpi-strip" aria-label="Key figures">
          <div class="kpi-card">
            <span class="kpi-label">Total raised</span>
            <span id="kpiTotal" class="kpi-value">—</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Supporters</span>
            <span id="kpiSupporters" class="kpi-value">—</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Recurring donors</span>
            <span id="kpiRecurring" class="kpi-value">—</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Average gift</span>
            <span id="kpiAvg" class="kpi-value">—</span>
          </div>
        </section>

        <section class="filter-bar" aria-label="Filters">
          <div class="filter-group filter-search">
            <label class="filter-label" for="searchInput">Search</label>
            <input id="searchInput" class="input" type="search" autocomplete="off"
                   placeholder="Name, email or receipt number" aria-label="Search supporters" />
          </div>

          <div class="filter-group">
            <label class="filter-label" for="fySelect">Financial year</label>
            <select id="fySelect" class="input select" aria-label="Financial year">
              <option value="">All years</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="filter-label" for="methodSelect">Payment method</label>
            <select id="methodSelect" class="input select" aria-label="Payment method">
              <option value="">All methods</option>
            </select>
          </div>

          <div class="filter-group filter-check">
            <label class="check-label" for="successOnly">
              <input id="successOnly" class="check" type="checkbox" checked />
              <span>Successful only</span>
            </label>
          </div>
        </section>

        <section class="table-card" aria-label="Payments">
          <div id="tableWrap" class="table-wrap">
            <div class="table-state" id="tableLoading" role="status" aria-live="polite">
              <div class="skeleton" aria-hidden="true"></div>
              <span class="state-text">Loading payments…</span>
            </div>

            <div class="table-state" id="tableError" role="alert" hidden>
              <span class="state-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path d="M12 8v5M12 16h.01"></path>
                </svg>
              </span>
              <span class="state-text">We couldn't load the payments. Please try again.</span>
              <button type="button" class="btn btn-ghost" data-retry>Retry</button>
            </div>

            <div class="table-state" id="tableEmpty" role="status" hidden>
              <span class="state-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 7h16M4 12h16M4 17h10"></path>
                </svg>
              </span>
              <span class="state-text">No payments match these filters.</span>
            </div>

            <div class="table-scroll" id="tableScroll" hidden>
              <table id="payTable" class="pay-table">
                <thead id="thead">
                  <tr>
                    <th scope="col" data-key="payment_at" class="sortable" aria-sort="descending"><button type="button" class="th-btn">Date</button></th>
                    <th scope="col" data-key="supporter_name" class="sortable"><button type="button" class="th-btn">Supporter</button></th>
                    <th scope="col" data-key="project" class="sortable"><button type="button" class="th-btn">Project</button></th>
                    <th scope="col" data-key="payment_method" class="sortable"><button type="button" class="th-btn">Method</button></th>
                    <th scope="col" data-key="amount_paid" class="sortable num"><button type="button" class="th-btn">Amount</button></th>
                    <th scope="col" data-key="fee_amount" class="sortable num"><button type="button" class="th-btn">Fee</button></th>
                    <th scope="col" data-key="status" class="sortable"><button type="button" class="th-btn">Status</button></th>
                  </tr>
                </thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>

            <div class="card-list" id="cardList" hidden></div>
          </div>

          <div class="table-footer" id="tableFooter" hidden>
            <button type="button" id="prevBtn" class="btn btn-ghost" disabled>Previous</button>
            <span id="pageInfo" class="page-info" aria-live="polite">Showing 0–0 of 0</span>
            <button type="button" id="nextBtn" class="btn btn-ghost" disabled>Next</button>
          </div>
        </section>
      </div>
    </main>

    <div id="sidePanel" class="side-panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" hidden>
      <div class="panel-head">
        <h2 id="panelTitle" class="panel-title">Supporter</h2>
        <button type="button" id="panelCloseBtn" class="icon-btn" aria-label="Close panel">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>
      <div id="panelBody" class="panel-body"></div>
    </div>

    <div id="panelClose" class="panel-scrim" hidden></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
