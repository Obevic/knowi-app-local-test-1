<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-logo">
        <svg class="logo-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="#375357" stroke-width="1.6"></rect>
          <path d="M8 12.5l2.6 2.6L16 9.5" fill="none" stroke="#375357" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span class="logo-name">Task Tracker</span>
      </div>
      <nav class="sidebar-nav" aria-label="Primary">
        <a href="#" class="nav-link active" aria-current="page">
          <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M9 6h11M9 12h11M9 18h11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
            <circle cx="4.5" cy="6" r="1.4" fill="currentColor"></circle>
            <circle cx="4.5" cy="12" r="1.4" fill="currentColor"></circle>
            <circle cx="4.5" cy="18" r="1.4" fill="currentColor"></circle>
          </svg>
          <span class="nav-label">Tasks</span>
          <span id="nav-count" class="count-pill" aria-live="polite">0</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="viewer">
          <span class="viewer-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16">
              <circle cx="12" cy="9" r="3.4" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
              <path d="M5.5 19c0-3.3 2.9-5.2 6.5-5.2s6.5 1.9 6.5 5.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
            </svg>
          </span>
          <span id="viewer-name" class="viewer-name">Guest</span>
        </div>
      </div>
    </aside>

    <main id="main">
      <div class="main-inner">
        <header class="page-header">
          <h1 id="page-title" class="page-title">Tasks</h1>
          <button id="add-btn" class="btn btn-primary" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            </svg>
            Add task
          </button>
        </header>

        <div id="filter-bar" class="filter-bar" role="group" aria-label="Filter tasks by status">
          <button class="filter-btn active" data-status="all" type="button">All <span class="filter-count" data-count="all">0</span></button>
          <button class="filter-btn" data-status="To do" type="button">To do <span class="filter-count" data-count="To do">0</span></button>
          <button class="filter-btn" data-status="In progress" type="button">In progress <span class="filter-count" data-count="In progress">0</span></button>
          <button class="filter-btn" data-status="Done" type="button">Done <span class="filter-count" data-count="Done">0</span></button>
        </div>

        <div id="error-banner" class="error-banner" role="alert" hidden></div>

        <div id="session-expired" class="session-expired" hidden>
          <div class="session-card">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
              <path d="M12 3l8 4v5c0 5-3.4 8.4-8 9-4.6-.6-8-4-8-9V7l8-4z" fill="none" stroke="#9C2F3C" stroke-width="1.6" stroke-linejoin="round"></path>
              <path d="M12 8v5M12 16h.01" fill="none" stroke="#9C2F3C" stroke-width="1.6" stroke-linecap="round"></path>
            </svg>
            <h2 class="session-title">Your session has expired</h2>
            <p class="session-text">Please sign in again to continue managing your tasks.</p>
            <a id="login-link" class="btn btn-primary" href="login">Sign in</a>
          </div>
        </div>

        <section class="task-card" aria-label="Task list">
          <div class="table-wrap">
            <table id="task-table" class="task-table">
              <thead>
                <tr>
                  <th scope="col" class="col-task">Task</th>
                  <th scope="col" class="col-owner">Owner</th>
                  <th scope="col" class="col-status">Status</th>
                  <th scope="col" class="col-created">Created</th>
                  <th scope="col" class="col-actions">Actions</th>
                </tr>
              </thead>
              <tbody id="task-rows"></tbody>
            </table>
          </div>
          <div id="empty-state" class="empty-state" hidden>
            <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="#56666D" stroke-width="1.4"></rect>
              <path d="M8 9h8M8 13h5" fill="none" stroke="#56666D" stroke-width="1.4" stroke-linecap="round"></path>
            </svg>
            <p class="empty-title">No tasks here</p>
            <p class="empty-text">Add your first task to get started.</p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="task-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
      <h2 id="task-modal-title" class="modal-title">Add task</h2>
      <form id="task-form">
        <div class="field">
          <label for="task-title">Title</label>
          <input id="task-title" name="title" type="text" autocomplete="off" required maxlength="200">
        </div>
        <div class="field">
          <label for="task-owner">Owner</label>
          <input id="task-owner" name="owner" type="text" autocomplete="off" required maxlength="120">
        </div>
        <div class="field">
          <label for="task-status">Status</label>
          <select id="task-status" name="status">
            <option value="To do">To do</option>
            <option value="In progress">In progress</option>
            <option value="Done">Done</option>
          </select>
        </div>
        <input type="hidden" id="task-edit-id" name="id">
        <div class="modal-actions">
          <button id="task-cancel" class="btn btn-ghost" type="button">Cancel</button>
          <button id="task-save" class="btn btn-primary" type="submit">Save task</button>
        </div>
      </form>
    </div>
  </div>

  <div id="delete-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
      <h2 id="delete-modal-title" class="modal-title">Delete task</h2>
      <p class="modal-text">Are you sure you want to delete this task? This cannot be undone.</p>
      <input type="hidden" id="delete-id">
      <div class="modal-actions">
        <button id="delete-cancel" class="btn btn-ghost" type="button">Cancel</button>
        <button id="delete-confirm" class="btn btn-danger" type="button">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
