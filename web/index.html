<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victor Hello</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Primary navigation">
      <div class="sidebar-logo">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5h16M4 12h16M4 19h10"></path>
          </svg>
        </span>
        <span class="logo-name">Victor Hello</span>
      </div>

      <nav id="nav" aria-label="Sections">
        <a class="nav-link" href="#" aria-current="page">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </span>
          <span class="nav-label">All items</span>
          <span class="count-pill" id="nav-count" aria-hidden="true">0</span>
        </a>
        <a class="nav-link" href="#">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l8 4-8 4-8-4 8-4z"></path>
              <path d="M4 11l8 4 8-4M4 15l8 4 8-4"></path>
            </svg>
          </span>
          <span class="nav-label">Categories</span>
          <span class="count-pill" id="nav-cat-count" aria-hidden="true">0</span>
        </a>
      </nav>

      <div id="viewer" class="viewer">
        <span class="viewer-avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
          </svg>
        </span>
        <span class="viewer-name">Guest viewer</span>
      </div>
    </aside>

    <main id="main">
      <header class="page-header">
        <h1 id="page-title">Item ledger</h1>
        <div class="header-actions">
          <button id="theme-toggle" class="btn btn-ghost" type="button" aria-pressed="false" aria-label="Toggle dark mode" title="Toggle dark mode">
            <span class="icon-sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"></path>
              </svg>
            </span>
            <span class="icon-moon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"></path>
              </svg>
            </span>
          </button>
          <button id="export-btn" class="btn btn-primary" type="button" disabled>
            <span class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v12M8 11l4 4 4-4M5 21h14"></path>
              </svg>
            </span>
            <span class="btn-label">Export CSV</span>
          </button>
        </div>
      </header>

      <section class="card ledger-card" aria-labelledby="page-title">
        <div class="ledger-scroll">
          <table id="items-table" class="ledger">
            <caption class="visually-hidden">Item ledger with name, category, owner, status and last update</caption>
            <thead>
              <tr>
                <th scope="col">Item</th>
                <th scope="col">Category</th>
                <th scope="col">Owner</th>
                <th scope="col">Status</th>
                <th scope="col">Updated</th>
              </tr>
            </thead>
            <tbody id="items-body"></tbody>
          </table>
        </div>

        <div id="loading-skeleton" class="skeleton" hidden aria-hidden="true">
          <div class="skeleton-row"><span class="skeleton-bar w-40"></span><span class="skeleton-bar w-24"></span><span class="skeleton-bar w-32"></span><span class="skeleton-bar w-20"></span><span class="skeleton-bar w-28"></span></div>
          <div class="skeleton-row"><span class="skeleton-bar w-40"></span><span class="skeleton-bar w-24"></span><span class="skeleton-bar w-32"></span><span class="skeleton-bar w-20"></span><span class="skeleton-bar w-28"></span></div>
          <div class="skeleton-row"><span class="skeleton-bar w-40"></span><span class="skeleton-bar w-24"></span><span class="skeleton-bar w-32"></span><span class="skeleton-bar w-20"></span><span class="skeleton-bar w-28"></span></div>
          <div class="skeleton-row"><span class="skeleton-bar w-40"></span><span class="skeleton-bar w-24"></span><span class="skeleton-bar w-32"></span><span class="skeleton-bar w-20"></span><span class="skeleton-bar w-28"></span></div>
          <div class="skeleton-row"><span class="skeleton-bar w-40"></span><span class="skeleton-bar w-24"></span><span class="skeleton-bar w-32"></span><span class="skeleton-bar w-20"></span><span class="skeleton-bar w-28"></span></div>
        </div>

        <div id="empty-state" class="empty-state" hidden>
          <span class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16M4 12h16M4 18h10"></path>
            </svg>
          </span>
          <p class="empty-title">No items yet</p>
          <p class="empty-body">Items will appear here once they are added to the ledger.</p>
        </div>

        <div id="items-status" class="items-status" role="status" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
