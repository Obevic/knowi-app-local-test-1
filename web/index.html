<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Expenses</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <path d="M3 9h18"></path>
            <path d="M8 14h8"></path>
          </svg>
        </span>
        <span class="brand-name">Team Expenses</span>
      </div>

      <nav class="nav" aria-label="Primary">
        <a class="nav-link is-active" href="#" aria-current="page">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 18h10"></path>
            </svg>
          </span>
          <span class="nav-label">Expenses</span>
          <span class="count-pill" id="count-pill" aria-label="Total expenses">0</span>
        </a>
      </nav>

      <div class="viewer" id="viewer" hidden>
        <span class="viewer-avatar" aria-hidden="true"></span>
        <span class="viewer-meta">
          <span class="viewer-name" id="viewer-name"></span>
          <span class="viewer-email" id="viewer-email"></span>
        </span>
      </div>
    </aside>

    <main class="content">
      <div class="content-inner">
        <header class="page-head">
          <h1 class="page-title">Team Expenses</h1>
          <p class="page-sub">Track, add, and review the team's spending at a glance.</p>
        </header>

        <div class="status" id="status" role="status" aria-live="polite" hidden></div>

        <section class="card form-card" aria-labelledby="add-title">
          <h2 class="card-title" id="add-title">Add expense</h2>
          <form class="add-form" id="add-form" novalidate>
            <div class="form-grid">
              <label class="field">
                <span class="field-label">Date</span>
                <input class="input" type="date" name="date" id="f-date" required>
              </label>
              <label class="field">
                <span class="field-label">Category</span>
                <input class="input" type="text" name="category" id="f-category" list="category-list" placeholder="e.g. Travel" required>
                <datalist id="category-list"></datalist>
              </label>
              <label class="field">
                <span class="field-label">Amount</span>
                <input class="input" type="number" name="amount" id="f-amount" step="0.01" min="0" placeholder="0.00" required>
              </label>
              <label class="field field-wide">
                <span class="field-label">Note</span>
                <input class="input" type="text" name="note" id="f-note" placeholder="Optional detail">
              </label>
            </div>
            <div class="form-actions">
              <button class="btn btn-primary" type="submit" id="add-submit">Add expense</button>
            </div>
          </form>
        </section>

        <section class="card table-card" aria-labelledby="expenses-title">
          <div class="card-head">
            <h2 class="card-title" id="expenses-title">Expenses</h2>
            <span class="card-hint">Newest first</span>
          </div>
          <div class="table-wrap">
            <table class="ledger" id="expenses-table">
              <thead>
                <tr>
                  <th scope="col">Date</th>
                  <th scope="col">Category</th>
                  <th scope="col" class="num">Amount</th>
                  <th scope="col">Note</th>
                </tr>
              </thead>
              <tbody id="expenses-body"></tbody>
            </table>
          </div>
          <div class="table-foot">
            <button class="btn btn-ghost" type="button" id="show-more" hidden>Show more</button>
          </div>
        </section>

        <section class="card chart-card" aria-labelledby="chart-title">
          <div class="card-head">
            <h2 class="card-title" id="chart-title">This month by category</h2>
            <span class="card-hint" id="month-label"></span>
          </div>
          <div class="chart-wrap" id="chart"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
