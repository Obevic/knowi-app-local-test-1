<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Desk</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <p class="brand">Inventory Desk</p>
        <nav aria-label="Primary">
          <ul class="nav-list">
            <li>
              <a class="nav-link" href="#" aria-current="page">
                <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 8L12 3 3 8v8l9 5 9-5V8z"></path>
                  <path d="M3 8l9 5 9-5"></path>
                  <path d="M12 13v8"></path>
                </svg>
                <span class="nav-label">Inventory</span>
                <span class="nav-count" id="nav-count">0</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
      <div class="viewer">
        <div class="viewer-avatar" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
          </svg>
        </div>
        <div class="viewer-text">
          <span class="viewer-name" id="viewer-name">Loading…</span>
          <span class="viewer-sub" id="viewer-sub"></span>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="content">
        <h1 class="page-title">Inventory Desk</h1>

        <div class="controls-row">
          <div class="field">
            <label for="search-input">Search item</label>
            <input type="text" id="search-input" placeholder="Search by item name" autocomplete="off" />
          </div>
          <div class="field">
            <label for="supplier-filter">Filter</label>
            <select id="supplier-filter">
              <option value="All">All suppliers</option>
            </select>
          </div>
        </div>

        <div class="summary-card">
          <span class="summary-label">Total stock value</span>
          <span class="summary-value" id="total-value">$0</span>
        </div>

        <div id="empty-state" class="empty-state" hidden>
          <p class="empty-state-title">No items match your search</p>
          <p>Try a different item name or choose a different supplier filter.</p>
        </div>

        <div class="table-card">
          <div class="table-wrap" id="table-wrap">
            <table class="inventory-table">
              <thead>
                <tr>
                  <th scope="col">Item</th>
                  <th scope="col">Supplier</th>
                  <th scope="col">Quantity</th>
                  <th scope="col">Reorder point</th>
                  <th scope="col">Unit cost</th>
                  <th scope="col">Restock</th>
                </tr>
              </thead>
              <tbody id="inventory-body"></tbody>
            </table>
          </div>
          <div class="show-more-row" id="show-more" hidden>
            <button type="button" class="btn-show-more" id="show-more-btn">Show more items</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="live-region" class="sr-only" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
