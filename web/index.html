<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Tracker</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app-shell" class="app-shell">

    <!-- Left sidebar: app name, nav links with icons + count pills, local-data viewer line -->
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8l9-4 9 4-9 4-9-4z"></path>
            <path d="M3 8v8l9 4 9-4V8"></path>
            <path d="M12 12v8"></path>
          </svg>
        </span>
        <span class="brand-name">Inventory</span>
      </div>

      <nav class="sidebar-nav" aria-label="Sections">
        <a href="#inventory" class="nav-link is-active" aria-current="page">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 17h10"></path>
            </svg>
          </span>
          <span class="nav-label">Inventory</span>
          <span class="nav-pill" id="nav-count-inventory" aria-hidden="true">0</span>
        </a>
        <a href="#summary" class="nav-link">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 20V10"></path>
              <path d="M10 20V4"></path>
              <path d="M16 20v-6"></path>
              <path d="M22 20H2"></path>
            </svg>
          </span>
          <span class="nav-label">Summary</span>
          <span class="nav-pill" id="nav-count-summary" aria-hidden="true">0</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <span class="viewer-dot" aria-hidden="true"></span>
        <span class="viewer-label">Local data</span>
      </div>
    </aside>

    <!-- Main canvas -->
    <main id="main" class="main">
      <div class="content">

        <!-- Header row: serif page title + Add item button -->
        <header class="page-header">
          <h1 id="page-title" class="page-title">Inventory</h1>
          <button id="add-item-btn" class="btn btn-primary" type="button">
            <span class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
            </span>
            Add item
          </button>
        </header>

        <!-- Filter bar: category select (built from rows) + search input -->
        <section class="filter-bar" aria-label="Filters">
          <div class="filter-field">
            <label class="filter-label" for="category-filter">Category</label>
            <select id="category-filter" class="input select">
              <option value="">All categories</option>
            </select>
          </div>
          <div class="filter-field filter-field-grow">
            <label class="filter-label" for="search-input">Search</label>
            <input id="search-input" class="input" type="search" placeholder="Search by name or category" autocomplete="off" />
          </div>
        </section>

        <!-- Stock summary panel -->
        <section id="summary-panel" class="card summary-panel" aria-labelledby="summary-heading">
          <h2 id="summary-heading" class="card-title">Stock summary</h2>
          <div id="summary-stats" class="summary-stats">
            <div class="summary-top">
              <div class="stat">
                <span class="stat-value" id="stat-total-items">0</span>
                <span class="stat-label">Total items</span>
              </div>
              <div class="stat">
                <span class="stat-value" id="stat-total-units">0</span>
                <span class="stat-label">Total units</span>
              </div>
              <div class="stat">
                <span class="stat-value" id="stat-low-stock">0</span>
                <span class="stat-label">Low stock</span>
              </div>
            </div>
            <div class="summary-ledger">
              <h3 class="ledger-heading">Units by category</h3>
              <ul id="summary-categories" class="ledger-list"></ul>
            </div>
          </div>
        </section>

        <!-- Items ledger -->
        <section class="card items-card" aria-labelledby="items-heading">
          <h2 id="items-heading" class="card-title">Items</h2>
          <div class="table-wrap">
            <table id="items-table" class="items-table">
              <thead>
                <tr>
                  <th scope="col">Item</th>
                  <th scope="col">Category</th>
                  <th scope="col" class="num">Quantity</th>
                  <th scope="col" class="num">Unit price</th>
                  <th scope="col" class="num">Value</th>
                  <th scope="col">Status</th>
                  <th scope="col" class="actions-col">Actions</th>
                </tr>
              </thead>
              <tbody id="items-body"></tbody>
            </table>
          </div>

          <!-- Empty state (hidden when rows exist) -->
          <div id="empty-state" class="empty-state" hidden>
            <span class="empty-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 8l9-4 9 4-9 4-9-4z"></path>
                <path d="M3 8v8l9 4 9-4V8"></path>
              </svg>
            </span>
            <p class="empty-title">No items to show</p>
            <p class="empty-text">Add your first item or adjust the filters above.</p>
          </div>

          <!-- Show more control -->
          <div class="show-more-row">
            <button id="show-more-btn" class="btn btn-ghost" type="button" hidden>Show more</button>
          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- Add / Edit modal dialog -->
  <div id="item-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <h2 id="modal-title" class="modal-title">Add item</h2>
        <button id="modal-close" class="icon-btn" type="button" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6l12 12"></path>
            <path d="M18 6L6 18"></path>
          </svg>
        </button>
      </header>
      <form id="item-form" class="modal-form" novalidate>
        <div class="form-field">
          <label class="field-label" for="item-name">Name</label>
          <input id="item-name" class="input" type="text" required autocomplete="off" />
        </div>
        <div class="form-field">
          <label class="field-label" for="item-category">Category</label>
          <input id="item-category" class="input" type="text" required autocomplete="off" list="category-suggestions" />
          <datalist id="category-suggestions"></datalist>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="field-label" for="item-qty">Quantity</label>
            <input id="item-qty" class="input" type="number" min="0" step="1" required />
          </div>
          <div class="form-field">
            <label class="field-label" for="item-price">Unit price</label>
            <input id="item-price" class="input" type="number" min="0" step="0.01" required />
          </div>
        </div>
        <footer class="modal-footer">
          <button id="modal-cancel" class="btn btn-ghost" type="button">Cancel</button>
          <button id="modal-save" class="btn btn-primary" type="submit">Save item</button>
        </footer>
      </form>
    </div>
  </div>

  <!-- Toast for transient feedback -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
