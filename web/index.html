<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipment Rental Desk</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <svg class="logo-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
          <path d="M3 9h18" stroke="currentColor" stroke-width="1.6"></path>
          <circle cx="7" cy="6.5" r="1" fill="currentColor"></circle>
          <circle cx="10" cy="6.5" r="1" fill="currentColor"></circle>
        </svg>
        <span class="logo-text">Equipment Rental Desk</span>
      </div>
      <nav class="sidebar-nav" aria-label="Primary">
        <a class="nav-link active" href="#" aria-current="page">
          <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M4 5h16v14H4z" fill="none" stroke="currentColor" stroke-width="1.6"></path>
            <path d="M4 10h16M9 5v14" stroke="currentColor" stroke-width="1.6"></path>
          </svg>
          <span class="nav-label">Rental Desk</span>
          <span class="nav-pill" id="navCount" aria-hidden="true">0</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="viewer">
          <span class="viewer-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <circle cx="12" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6" fill="none" stroke="currentColor" stroke-width="1.6"></path>
            </svg>
          </span>
          <span class="viewer-name" id="viewerName">Signed in</span>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="page-header">
        <h1 class="page-title">Rental Desk</h1>
        <div class="toolbar">
          <div class="search-wrap">
            <label class="sr-only" for="search">Search rentals</label>
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
              <path d="M20 20l-4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
            </svg>
            <input type="search" id="search" class="search-input" placeholder="Search item or customer" autocomplete="off">
          </div>
          <div class="filter-wrap">
            <label class="sr-only" for="statusFilter">Filter by status</label>
            <select id="statusFilter" class="status-select">
              <option value="">All statuses</option>
            </select>
          </div>
          <span class="overdue-badge" id="overdueBadge" title="Overdue rentals">
            <span class="overdue-dot" aria-hidden="true"></span>
            <span class="overdue-label">Overdue</span>
            <span class="overdue-count" id="overdueCount">0</span>
          </span>
        </div>
      </header>

      <section class="card table-card" aria-labelledby="tableHeading">
        <div class="table-scroll">
          <table id="rentalTable">
            <caption id="tableHeading" class="sr-only">Equipment rentals</caption>
            <thead>
              <tr>
                <th scope="col" class="col-item">Item</th>
                <th scope="col" class="col-customer">Customer</th>
                <th scope="col" class="col-date">Start</th>
                <th scope="col" class="col-date">Due</th>
                <th scope="col" class="col-status">Status</th>
              </tr>
            </thead>
            <tbody id="rentalBody"></tbody>
          </table>
        </div>
        <div class="table-empty" id="tableEmpty" hidden>
          <p>No rentals match your search or filter.</p>
        </div>
      </section>
    </main>
  </div>

  <div class="loading-skeleton" id="loadingSkeleton" aria-hidden="true">
    <div class="skel skel-title"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
    <div class="skel skel-row"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
