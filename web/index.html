<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Desk</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
          <g>
            <path d="M16 2 L18.5 11 L27 8 L21 15 L29 19 L19 19 L22 28 L16 21 L10 28 L13 19 L3 19 L11 15 L5 8 L13.5 11 Z" fill="#3b82f6"></path>
            <circle cx="16" cy="16" r="4.5" fill="#f59e0b"></circle>
            <circle cx="16" cy="16" r="2" fill="#ffffff"></circle>
          </g>
        </svg>
        <span class="wordmark">knowi</span>
      </div>
      <span class="badge">Synthetic data</span>
    </div>
  </header>

  <main class="page">
    <h1 class="page-title">Inventory Desk</h1>

    <div class="controls">
      <div class="control-field">
        <label class="field-label" for="searchInput">Search item</label>
        <input type="text" id="searchInput" class="text-input" placeholder="Search by item name" autocomplete="off">
      </div>
      <div class="control-field">
        <label class="field-label" for="filterSelect">Filter</label>
        <select id="filterSelect" class="select-input">
          <option value="All">All</option>
        </select>
      </div>
    </div>

    <section class="total-card" aria-label="Total stock value">
      <span class="total-label">Total stock value</span>
      <span class="total-value" id="totalValue">$0</span>
    </section>

    <section class="table-card">
      <div class="table-scroll">
        <table class="items-table" id="itemsTable">
          <thead>
            <tr>
              <th scope="col">Item</th>
              <th scope="col">Supplier</th>
              <th scope="col">Quantity</th>
              <th scope="col">Reorder Point</th>
              <th scope="col">Unit Cost</th>
              <th scope="col">Restock</th>
            </tr>
          </thead>
          <tbody id="itemsBody">
            <tr class="state-row">
              <td colspan="6" class="state-cell" id="stateCell">Loading inventory…</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="table-footer">
        <button type="button" class="show-more" id="showMoreBtn" hidden>Show more</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
