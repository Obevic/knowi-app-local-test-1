<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Desk</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path>
              <path d="M3 8l9 5 9-5"></path>
              <path d="M12 13v8"></path>
            </svg>
          </span>
          <span class="brand-name">Inventory&nbsp;Desk</span>
        </div>
        <nav class="nav" aria-label="Sections">
          <a class="nav-link" href="#inventory" aria-current="page">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7h16M4 12h16M4 17h10"></path>
              </svg>
            </span>
            <span class="nav-label">Inventory</span>
            <span class="nav-pill" id="navCount">0</span>
          </a>
          <a class="nav-link" href="#reorder">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 12a8 8 0 1 1-2.3-5.6"></path>
                <path d="M20 4v4h-4"></path>
              </svg>
            </span>
            <span class="nav-label">Reorder</span>
            <span class="nav-pill" id="reorderCount">0</span>
          </a>
        </nav>
      </div>
      <div class="sidebar-bottom">
        <div class="viewer" id="viewer">
          <span class="viewer-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
            </svg>
          </span>
          <span class="viewer-meta">
            <span class="viewer-name" id="viewerName">Signed in</span>
            <span class="viewer-email" id="viewerEmail">—</span>
          </span>
        </div>
      </div>
    </aside>

    <main class="canvas">
      <div class="content">
        <header class="page-head">
          <h1 class="page-title">Inventory Desk</h1>
          <p class="page-sub">Track stock levels, reorder points and total value across every supplier.</p>
        </header>

        <section class="controls" aria-label="Search and filter">
          <div class="field">
            <label class="field-label" for="searchInput">Search item</label>
            <input class="field-input" id="searchInput" type="search" placeholder="Type an item name…" autocomplete="off">
          </div>
          <div class="field">
            <label class="field-label" for="filterSelect">Filter</label>
            <select class="field-input" id="filterSelect" aria-label="Filter by supplier"></select>
          </div>
        </section>

        <section class="summary-card" aria-label="Total stock value">
          <span class="summary-label">Total stock value</span>
          <span class="summary-value" id="totalValue">$0.00</span>
        </section>

        <section class="table-card" aria-label="Inventory items">
          <div class="table-scroll">
            <table class="inv-table">
              <thead>
                <tr>
                  <th scope="col">Item</th>
                  <th scope="col">Supplier</th>
                  <th scope="col">Quantity</th>
                  <th scope="col">Reorder Point</th>
                  <th scope="col">Unit Cost</th>
                  <th scope="col">Restock</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="table-foot">
            <span class="foot-count" id="rowCount">0 items</span>
            <button class="btn btn-ghost" id="showMore" type="button" hidden>Show more</button>
          </div>
        </section>

        <div class="state" id="stateBox" hidden>
          <p class="state-text" id="stateText"></p>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
