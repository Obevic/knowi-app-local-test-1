<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Desk</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <svg class="brand-mark" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M2 2 L14 14 L2 26" fill="none" stroke="#375357" stroke-width="3.2" stroke-linecap="round" />
          <path d="M26 2 L14 14 L26 26" fill="none" stroke="#4e6e78" stroke-width="3.2" stroke-linecap="round" />
        </svg>
        <span class="brand-name">Inventory Desk</span>
      </div>
      <span class="data-badge">Synthetic data</span>
    </header>

    <main class="app-main">
      <h1 class="page-title serif">Inventory Desk</h1>

      <div class="controls">
        <div class="control-field">
          <label for="search-input">Search item</label>
          <input type="text" id="search-input" placeholder="Search by item name" autocomplete="off" />
        </div>
        <div class="control-field">
          <label for="supplier-filter">Filter</label>
          <select id="supplier-filter"></select>
        </div>
      </div>

      <section class="summary-card" aria-label="Total stock value">
        <span class="summary-label">Total stock value</span>
        <span class="summary-value serif" id="total-stock-value">$0</span>
      </section>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th scope="col">Item</th>
              <th scope="col">Supplier</th>
              <th scope="col">Quantity</th>
              <th scope="col">Reorder point</th>
              <th scope="col">Unit cost</th>
              <th scope="col">Restock</th>
            </tr>
          </thead>
          <tbody id="items-tbody"></tbody>
        </table>
        <div class="empty-state" id="empty-state" hidden>No items match your search or filter.</div>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
