<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-logo">
        <svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
          <path d="M8 12.5l2.6 2.6L16 9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span class="logo-name">Task Tracker</span>
      </div>
      <nav class="sidebar-nav" aria-label="Primary">
        <a href="#" id="nav-tasks" class="nav-link active" aria-current="page">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
          </svg>
          <span class="nav-label">Tasks</span>
          <span class="count-pill" id="count-tasks">0</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div id="viewer" class="viewer">
          <span class="viewer-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="9" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
              <path d="M5 19c0-3.3 3.1-5.4 7-5.4s7 2.1 7 5.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
            </svg>
          </span>
          <span class="viewer-name">Signed in</span>
        </div>
      </div>
    </aside>

    <main id="main">
      <header class="page-header">
        <h1 class="page-title">Tasks</h1>
        <button type="button" id="btn-new" class="btn btn-primary">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path>
          </svg>
          New task
        </button>
      </header>

      <div class="filter-row" id="filter-status" role="group" aria-label="Filter tasks by status"></div>

      <section class="content" aria-live="polite">
        <div id="task-list" class="task-list"></div>
      </section>
    </main>
  </div>

  <div id="task-dialog" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title" class="dialog-title">New task</h2>
        <button type="button" id="dialog-close" class="dialog-close" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
        </button>
      </div>
      <form id="task-form" novalidate>
        <div class="field">
          <label class="field-label" for="f-title">Title</label>
          <input type="text" id="f-title" name="title" class="input" maxlength="200" required autocomplete="off">
        </div>
        <div class="field">
          <label class="field-label" for="f-owner">Owner</label>
          <input type="text" id="f-owner" name="owner" class="input" maxlength="120" autocomplete="off">
        </div>
        <div class="field">
          <label class="field-label" for="f-status">Status</label>
          <select id="f-status" name="status" class="input select">
            <option value="To do">To do</option>
            <option value="In progress">In progress</option>
            <option value="Done">Done</option>
          </select>
        </div>
        <div class="dialog-actions">
          <button type="button" id="btn-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" id="btn-save" class="btn btn-primary">Save task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
