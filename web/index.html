<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Desk</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8l9-5 9 5v8l-9 5-9-5V8z"></path>
              <path d="M3 8l9 5 9-5"></path>
              <path d="M12 13v8"></path>
            </svg>
          </span>
          <span class="brand-name">Inventory Desk</span>
        </div>
      </div>

      <nav class="nav" aria-label="Primary">
        <a class="nav-link" href="#" data-nav="inventory">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16M4 12h16M4 17h10"></path>
            </svg>
          </span>
          <span class="nav-label">Inventory</span>
          <span class="nav-pill" id="navCount">0</span>
        </a>
        <a class="nav-link" href="#" data-nav="suppliers">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9z"></path>
              <path d="M9 21v-6h6v6"></path>
            </svg>
          </span>
          <span class="nav-label">Suppliers</span>
          <span class="nav-pill" id="supplierCount">0</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="viewer">
          <span class="viewer-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 20c0-3.3 3.6-5 8-5s8 1.7 8 5"></path>
            </svg>
          </span>
          <span class="viewer-name" id="viewerName">Signed in</span>
        </div>
      </div>
    </aside>

    <main class="canvas">
      <div class="content">
        <header class="page-head">
          <h1 class="page-title">Inventory Desk</h1>
          <span class="pill pill-muted">Synthetic data</span>
        </header>

        <section class="controls" aria-label="Search and filter">
          <div class="field">
            <label class="field-label" for="searchInput">Search item</label>
            <input class="field-input" id="searchInput" type="text" placeholder="Search by item name" autocomplete="off">
          </div>
          <div class="field">
            <label class="field-label" for="filterSelect">Filter</label>
            <select class="field-input" id="filterSelect" aria-label="Filter by supplier"></select>
          </div>
        </section>

        <section class="card summary-card" aria-label="Total stock value">
          <span class="summary-label">Total stock value</span>
          <span class="summary-value" id="totalValue">$0</span>
        </section>

        <section class="card table-card" aria-label="Inventory items">
          <div class="table-scroll">
            <table class="ledger">
              <thead>
                <tr>
                  <th scope="col" class="col-item">Item</th>
                  <th scope="col">Supplier</th>
                  <th scope="col">Quantity</th>
                  <th scope="col">Reorder point</th>
                  <th scope="col">Unit cost</th>
                  <th scope="col">Restock</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="table-empty" id="tableEmpty" hidden>
            <p>No items match your search or filter.</p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
