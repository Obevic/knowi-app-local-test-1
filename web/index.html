<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Victor Helpdesk</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 13a8 8 0 0 1 16 0"></path>
            <path d="M4 13h3v5H4z"></path>
            <path d="M20 13h-3v5h3z"></path>
            <path d="M7 18v1a3 3 0 0 0 3 3h3"></path>
          </svg>
        </span>
        <span class="brand-name">Victor Helpdesk</span>
      </div>

      <nav class="nav" aria-label="Primary">
        <a class="nav-link" href="#" data-nav="all">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <path d="M3 9h18"></path>
              <path d="M8 4v5"></path>
            </svg>
          </span>
          <span class="nav-label">All tickets</span>
          <span class="nav-count" id="count-all" data-count="all">0</span>
        </a>
        <a class="nav-link" href="#" data-nav="open">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 8v4"></path>
              <path d="M12 16h.01"></path>
            </svg>
          </span>
          <span class="nav-label">Open</span>
          <span class="nav-count" id="count-open" data-count="open">0</span>
        </a>
        <a class="nav-link" href="#" data-nav="inprogress">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-3-6.7"></path>
              <path d="M21 4v5h-5"></path>
            </svg>
          </span>
          <span class="nav-label">In progress</span>
          <span class="nav-count" id="count-inprogress" data-count="inprogress">0</span>
        </a>
        <a class="nav-link" href="#" data-nav="resolved">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M8 12l3 3 5-6"></path>
            </svg>
          </span>
          <span class="nav-label">Resolved</span>
          <span class="nav-count" id="count-resolved" data-count="resolved">0</span>
        </a>
      </nav>

      <div class="viewer" id="viewer" hidden>
        <span class="viewer-avatar" id="viewer-avatar" aria-hidden="true"></span>
        <span class="viewer-meta">
          <span class="viewer-name" id="viewer-name"></span>
          <span class="viewer-email" id="viewer-email"></span>
        </span>
      </div>
    </aside>

    <main class="content">
      <div class="content-inner">
        <header class="page-head">
          <div>
            <h1 class="page-title">Ticket board</h1>
            <p class="page-sub">Support queue for the Victor IT helpdesk.</p>
          </div>
        </header>

        <section class="kpis" id="kpis" aria-label="Key metrics">
          <div class="kpi-card">
            <span class="kpi-label">Open</span>
            <span class="kpi-value" id="kpi-open">0</span>
            <span class="kpi-hint">Awaiting a first response</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">In progress</span>
            <span class="kpi-value" id="kpi-inprogress">0</span>
            <span class="kpi-hint">Being worked on now</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Resolved today</span>
            <span class="kpi-value" id="kpi-resolved">0</span>
            <span class="kpi-hint">Closed on the latest day</span>
          </div>
        </section>

        <section class="panel" aria-label="Ticket list">
          <div class="panel-head">
            <h2 class="panel-title">Tickets</h2>
            <div class="filters">
              <label class="field">
                <span class="field-label">Category</span>
                <select id="filter-category" class="select" aria-label="Filter by category">
                  <option value="">All categories</option>
                </select>
              </label>
              <label class="field">
                <span class="field-label">Status</span>
                <select id="filter-status" class="select" aria-label="Filter by status">
                  <option value="">All statuses</option>
                </select>
              </label>
            </div>
          </div>

          <div class="table-wrap">
            <table class="tickets-table" id="tickets-table">
              <thead>
                <tr>
                  <th scope="col" data-key="id" aria-sort="none"><button class="th-btn" type="button">ID</button></th>
                  <th scope="col" data-key="subject" aria-sort="none"><button class="th-btn" type="button">Subject</button></th>
                  <th scope="col" data-key="requester" aria-sort="none"><button class="th-btn" type="button">Requester</button></th>
                  <th scope="col" data-key="category" aria-sort="none"><button class="th-btn" type="button">Category</button></th>
                  <th scope="col" data-key="priority" aria-sort="none"><button class="th-btn" type="button">Priority</button></th>
                  <th scope="col" data-key="status" aria-sort="none"><button class="th-btn" type="button">Status</button></th>
                  <th scope="col" data-key="created" aria-sort="none"><button class="th-btn" type="button">Created</button></th>
                </tr>
              </thead>
              <tbody id="tickets-body"></tbody>
            </table>
          </div>

          <div class="table-foot">
            <span class="table-count" id="table-count">0 tickets</span>
            <button class="btn btn-ghost" id="show-more" type="button" hidden>Show more</button>
          </div>
        </section>

        <section class="detail" id="detail" hidden aria-label="Ticket details">
          <div class="detail-head">
            <div>
              <span class="detail-id" id="detail-id"></span>
              <h2 class="detail-title" id="detail-title"></h2>
            </div>
            <button class="btn btn-ghost" id="detail-close" type="button">Close</button>
          </div>
          <dl class="detail-facts">
            <div class="fact"><dt>Requester</dt><dd id="detail-requester"></dd></div>
            <div class="fact"><dt>Category</dt><dd id="detail-category"></dd></div>
            <div class="fact"><dt>Priority</dt><dd id="detail-priority"></dd></div>
            <div class="fact"><dt>Created</dt><dd id="detail-created"></dd></div>
          </dl>
          <form class="detail-form" id="status-form">
            <label class="field">
              <span class="field-label">Update status</span>
              <select id="status-select" class="select" aria-label="New status"></select>
            </label>
            <button class="btn btn-primary" id="status-save" type="submit">Save status</button>
            <span class="form-msg" id="form-msg" role="status" aria-live="polite"></span>
          </form>
        </section>

        <div class="state" id="state" hidden>
          <div class="state-card">
            <span class="state-icon" id="state-icon" aria-hidden="true"></span>
            <h2 class="state-title" id="state-title"></h2>
            <p class="state-body" id="state-body"></p>
            <a class="btn btn-primary" id="state-action" href="login" hidden>Sign in again</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
