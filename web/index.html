<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Maintenance Board</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary">
      <div class="sidebar-logo">
        <svg class="logo-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <rect x="2" y="6" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
          <path d="M16 10h3l3 3v3h-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
          <circle cx="7" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
          <circle cx="18" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
        </svg>
        <span class="logo-text">Fleet Maintenance</span>
      </div>
      <nav class="sidebar-nav" aria-label="Sections">
        <a class="nav-link" href="#" aria-current="page">
          <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
            <path d="M3 9h18M9 9v11" fill="none" stroke="currentColor" stroke-width="1.6"></path>
          </svg>
          <span class="nav-label">Fleet board</span>
          <span class="count-pill" id="navCount">0</span>
        </a>
        <a class="nav-link" href="#">
          <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
          </svg>
          <span class="nav-label">Depots</span>
          <span class="count-pill" id="depotCount">0</span>
        </a>
        <a class="nav-link" href="#">
          <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path d="M12 20a8 8 0 10-8-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
            <path d="M4 12a8 8 0 018-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
            <path d="M12 12l4-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
          </svg>
          <span class="nav-label">Service log</span>
          <span class="count-pill" id="serviceCount">0</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="viewer">
          <span class="viewer-avatar" aria-hidden="true">V</span>
          <span class="viewer-name" id="viewerName">Viewer</span>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="page-head">
        <h1 class="page-title">Fleet Maintenance Board</h1>
        <p class="page-sub">Track service status across the fleet by plate, model and depot.</p>
      </header>

      <section class="board-card" aria-labelledby="boardHeading">
        <div class="toolbar">
          <div class="field">
            <label class="field-label" for="search">Search</label>
            <input type="search" id="search" class="input" placeholder="Plate, model or depot" autocomplete="off">
          </div>
          <div class="field">
            <label class="field-label" for="statusFilter">Status</label>
            <select id="statusFilter" class="input select">
              <option value="">All statuses</option>
            </select>
          </div>
          <div class="results-count" id="resultsCount" aria-live="polite"></div>
        </div>

        <div class="table-wrap">
          <table class="fleet-table" id="fleetTable">
            <thead>
              <tr>
                <th scope="col">Plate</th>
                <th scope="col">Model</th>
                <th scope="col">Depot</th>
                <th scope="col">Last service</th>
                <th scope="col">Status</th>
              </tr>
            </thead>
            <tbody id="fleetBody"></tbody>
          </table>
        </div>

        <div class="empty-state" id="emptyState" hidden>
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
            <path d="M20 20l-4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
          </svg>
          <p>No vehicles match your search or filter.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
