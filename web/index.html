<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supporter Hub</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary">
      <div class="sidebar-logo">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 5 6.5 5c2 0 3.5 1.2 4.5 2.6C12 6.2 13.5 5 15.5 5 19 5 21.5 8.5 20.5 12.5 18 16.65 12 21 12 21z" />
          </svg>
        </span>
        <span class="logo-text">Supporter Hub</span>
      </div>
      <nav class="sidebar-nav" aria-label="Sections">
        <a class="nav-link" href="#overview" data-nav="overview">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          </span>
          <span class="nav-label">Overview</span>
          <span class="nav-count" data-count="overview">–</span>
        </a>
        <a class="nav-link" href="#payments" data-nav="payments">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>
          </span>
          <span class="nav-label">Payments</span>
          <span class="nav-count" data-count="payments">–</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="viewer" id="viewer">
          <span class="viewer-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.3 3.6-5 8-5s8 1.7 8 5"/></svg>
          </span>
          <span class="viewer-name" id="viewerName">Viewer</span>
        </div>
      </div>
    </aside>

    <main class="canvas">
      <div class="content">
        <header class="page-header" id="overview">
          <div class="header-top">
            <div>
              <h1 class="page-title">Supporter Hub</h1>
              <p class="page-subtitle" id="dateRange">Loading payment dates…</p>
            </div>
            <span class="pill pill-preview" id="previewPill" hidden>Synthetic preview</span>
          </div>
        </header>

        <section class="kpi-strip" id="kpiStrip" aria-label="Key figures">
          <div class="kpi-card">
            <span class="kpi-label">Total raised</span>
            <span class="kpi-value" id="kpiTotal">–</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Supporters</span>
            <span class="kpi-value" id="kpiSupporters">–</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Recurring donors</span>
            <span class="kpi-value" id="kpiRecurring">–</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Average gift</span>
            <span class="kpi-value" id="kpiAvg">–</span>
          </div>
        </section>

        <section class="filter-bar" id="payments" aria-label="Filters">
          <div class="filter-field filter-search">
            <label class="filter-label" for="searchInput">Search</label>
            <input type="search" id="searchInput" class="input" placeholder="Name, email or receipt number" autocomplete="off" />
          </div>
          <div class="filter-field">
            <label class="filter-label" for="yearSelect">Financial year</label>
            <select id="yearSelect" class="input"></select>
          </div>
          <div class="filter-field">
            <label class="filter-label" for="methodSelect">Payment method</label>
            <select id="methodSelect" class="input"></select>
          </div>
          <div class="filter-field filter-check">
            <label class="check-label" for="successOnly">
              <input type="checkbox" id="successOnly" checked />
              <span>Successful only</span>
            </label>
          </div>
        </section>

        <section class="table-card" aria-label="Payments">
          <div class="table-scroll" id="tableScroll">
            <table class="payments-table" id="paymentsTable">
              <thead>
                <tr>
                  <th scope="col"><button class="th-btn" data-sort="date">Date <span class="sort-ind" aria-hidden="true"></span></button></th>
                  <th scope="col"><button class="th-btn" data-sort="supporter">Supporter <span class="sort-ind" aria-hidden="true"></span></button></th>
                  <th scope="col"><button class="th-btn" data-sort="project">Project <span class="sort-ind" aria-hidden="true"></span></button></th>
                  <th scope="col"><button class="th-btn" data-sort="method">Method <span class="sort-ind" aria-hidden="true"></span></button></th>
                  <th scope="col" class="num"><button class="th-btn" data-sort="amount">Amount <span class="sort-ind" aria-hidden="true"></span></button></th>
                  <th scope="col" class="num"><button class="th-btn" data-sort="fee">Fee <span class="sort-ind" aria-hidden="true"></span></button></th>
                  <th scope="col"><button class="th-btn" data-sort="status">Status <span class="sort-ind" aria-hidden="true"></span></button></th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="card-list" id="cardList" hidden></div>

          <div class="table-state" id="tableState" hidden></div>

          <div class="table-footer">
            <span class="showing" id="showing">Showing 0–0 of 0</span>
            <div class="pager">
              <button class="btn btn-ghost" id="prevBtn" disabled>Previous</button>
              <span class="page-ind" id="pageInd">Page 1</span>
              <button class="btn btn-ghost" id="nextBtn" disabled>Next</button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="panel-backdrop" id="panelBackdrop" hidden></div>
  <aside class="side-panel" id="sidePanel" role="dialog" aria-modal="true" aria-labelledby="panelName" hidden>
    <div class="panel-head">
      <h2 class="panel-title" id="panelName">Supporter</h2>
      <button class="panel-close" id="panelClose" aria-label="Close panel">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
